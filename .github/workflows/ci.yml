name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12.x", "24.x"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        env:
          # The suite is pure Node: it reads the desktop and Android sources as
          # text rather than launching them, so neither binary is ever needed.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: Build the web output
        # tests/status.test.js exercises the production server, which resolves
        # every request against dist/. That directory is generated, not tracked,
        # so a clean checkout has to build before it can test.
        run: npm run build
      - name: Test source behavior
        run: npm test
